<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ระบบจัดการสต็อกสินค้า</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:'Sarabun',Tahoma,sans-serif;background:#f0f4f8;font-size:14px}
  input,select,textarea{font-family:inherit}
  ::-webkit-scrollbar{width:6px;height:6px}
  ::-webkit-scrollbar-track{background:#f1f1f1}
  ::-webkit-scrollbar-thumb{background:#cbd5e0;border-radius:3px}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useCallback,useRef} = React;

// ======== CONFIG ========
const USERS=[
  {id:"admin",username:"admin",password:"admin1234",displayName:"ผู้ดูแลระบบ (Admin)",role:"admin"},
  {id:"store",username:"store",password:"store1234",displayName:"พนักงานคลังสินค้า",role:"store"},
];
const TABS=["หน้าหลัก","ค้นหารายการ","รับสินค้า","เบิกสินค้า","รายงาน"];
const DEPARTMENTS=["ฝ่ายบัญชี","ฝ่ายช่างยนต์","ฝ่ายช่างเชื่อม","ฝ่ายช่างไฟ","ฝ่ายพนักงานทั่วไป","ฝ่ายพลขับ","อื่นๆ"];
const SOURCE_TYPES=["ร้านค้าทั่วไป","ห้างสรรพสินค้า","ตลาด","สั่งออนไลน์","อื่นๆ"];
const MAX_ATTACH=3;
const DB="ims_store";

const initProducts=[
  {id:1,code:"P001",name:"กระดาษ A4",unit:"รีม",qty:45,minQty:20,maxQty:200,image:null},
  {id:2,code:"P002",name:"ปากกาลูกลื่น",unit:"แท่ง",qty:12,minQty:50,maxQty:500,image:null},
  {id:3,code:"P003",name:"แฟ้มเอกสาร",unit:"อัน",qty:80,minQty:30,maxQty:300,image:null},
  {id:4,code:"P004",name:"หมึกพิมพ์ดำ",unit:"ตลับ",qty:5,minQty:10,maxQty:50,image:null},
  {id:5,code:"P005",name:"กรรไกร",unit:"อัน",qty:25,minQty:10,maxQty:100,image:null},
];

// ======== UTILS ========
const fmt=n=>Number(n||0).toLocaleString("th-TH");
const todayStr=()=>new Date().toISOString().slice(0,10);
const nowTime=()=>new Date().toTimeString().slice(0,5);
const readImg=f=>new Promise(res=>{const r=new FileReader();r.onload=e=>res(e.target.result);r.readAsDataURL(f);});

const loadDB=key=>{try{const v=localStorage.getItem(DB+"_"+key);return v?JSON.parse(v):null;}catch{return null;}};
const saveDB=(key,val)=>{try{localStorage.setItem(DB+"_"+key,JSON.stringify(val));}catch(e){console.warn("Storage full",e);}};

// ======== STYLES ========
const inp=(x={})=>({width:"100%",padding:"7px 10px",border:"1px solid #cbd5e0",borderRadius:6,fontSize:13,fontFamily:"inherit",boxSizing:"border-box",...x});
const btn=(bg,color,x={})=>({background:bg,color,border:"none",borderRadius:6,padding:"7px 14px",cursor:"pointer",fontSize:13,fontFamily:"inherit",fontWeight:600,...x});
const Card=({children,style={}})=><div style={{background:"#fff",borderRadius:10,padding:14,boxShadow:"0 1px 4px rgba(0,0,0,.08)",...style}}>{children}</div>;
const Lbl=({children,c})=><div style={{fontSize:11,color:c||"#666",marginBottom:2}}>{children}</div>;

// ======== IMAGE VIEWER ========
function ImageViewer({images,startIdx=0,onClose}){
  const [idx,setIdx]=useState(startIdx);
  useEffect(()=>{
    const fn=e=>{if(e.key==="Escape")onClose();if(e.key==="ArrowRight")setIdx(i=>Math.min(i+1,images.length-1));if(e.key==="ArrowLeft")setIdx(i=>Math.max(i-1,0));};
    window.addEventListener("keydown",fn);return()=>window.removeEventListener("keydown",fn);
  },[images,onClose]);
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.9)",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",zIndex:9999}} onClick={onClose}>
      <div onClick={e=>e.stopPropagation()} style={{display:"flex",flexDirection:"column",alignItems:"center",gap:12,maxWidth:"92vw"}}>
        <img src={images[idx]} style={{maxWidth:"85vw",maxHeight:"70vh",borderRadius:10,objectFit:"contain",boxShadow:"0 8px 32px rgba(0,0,0,.5)"}} alt="view"/>
        <div style={{display:"flex",alignItems:"center",gap:16}}>
          <button onClick={()=>setIdx(i=>Math.max(i-1,0))} disabled={idx===0} style={btn("#fff","#333",{padding:"6px 18px",opacity:idx===0?.3:1})}>◀</button>
          <span style={{color:"#fff",fontSize:13}}>{idx+1} / {images.length}</span>
          <button onClick={()=>setIdx(i=>Math.min(i+1,images.length-1))} disabled={idx===images.length-1} style={btn("#fff","#333",{padding:"6px 18px",opacity:idx===images.length-1?.3:1})}>▶</button>
        </div>
        {images.length>1&&<div style={{display:"flex",gap:6}}>{images.map((img,i)=><img key={i} src={img} onClick={()=>setIdx(i)} style={{width:50,height:50,objectFit:"cover",borderRadius:6,border:i===idx?"3px solid #63b3ed":"2px solid transparent",cursor:"pointer",opacity:i===idx?1:.55}} alt="t"/>)}</div>}
        <button onClick={onClose} style={btn("#e53e3e","#fff")}>✕ ปิด (ESC)</button>
      </div>
    </div>
  );
}

// ======== ATTACH IMAGES ========
function AttachImages({images=[],onChange}){
  const handleAdd=async e=>{
    const files=Array.from(e.target.files);
    const rem=MAX_ATTACH-images.length;
    const datas=await Promise.all(files.slice(0,rem).map(f=>readImg(f)));
    onChange([...images,...datas].slice(0,MAX_ATTACH));
    e.target.value="";
  };
  const remove=i=>onChange(images.filter((_,j)=>j!==i));
  return(
    <div>
      <Lbl c="#555">📎 แนบรูปภาพ (สูงสุด {MAX_ATTACH} รูป){images.length>0&&` — แนบแล้ว ${images.length} รูป`}</Lbl>
      {images.length<MAX_ATTACH&&<input type="file" accept="image/*" multiple onChange={handleAdd} style={{fontSize:12,marginBottom:6}}/>}
      {images.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:4}}>{images.map((img,i)=><div key={i} style={{position:"relative"}}><img src={img} style={{width:68,height:68,objectFit:"cover",borderRadius:7,border:"1px solid #cbd5e0"}} alt="a"/><button onClick={()=>remove(i)} style={{position:"absolute",top:-6,right:-6,background:"#e53e3e",color:"#fff",border:"none",borderRadius:"50%",width:18,height:18,fontSize:10,cursor:"pointer",lineHeight:"18px",textAlign:"center",padding:0}}>✕</button></div>)}</div>}
    </div>
  );
}

function ThumbRow({images=[],onView}){
  if(!images.length)return null;
  return<div style={{display:"flex",gap:4,flexWrap:"wrap",marginTop:4}}>{images.map((img,i)=><img key={i} src={img} onClick={()=>onView(i)} style={{width:44,height:44,objectFit:"cover",borderRadius:5,border:"1px solid #cbd5e0",cursor:"pointer"}} alt="t"/>)}</div>;
}

// ======== MODAL ========
function Modal({title,children,onClose,wide}){
  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.5)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:200}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:12,padding:24,maxWidth:wide?560:440,width:"95%",maxHeight:"88vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:700,fontSize:15,color:"#1e3a5f",marginBottom:12}}>{title}</div>
        {children}
        <button onClick={onClose} style={btn("#1e3a5f","#fff",{width:"100%",marginTop:14})}>ปิด</button>
      </div>
    </div>
  );
}

// ======== GOOGLE SHEET MODAL ========
function SheetSyncModal({onClose,products,receives,issues}){
  const [url,setUrl]=useState(()=>localStorage.getItem("ims_sheeturl")||"");
  const [status,setStatus]=useState(null);
  const [syncing,setSyncing]=useState(false);

  const doSync=async()=>{
    if(!url.trim()){setStatus({ok:false,msg:"กรุณากรอก Apps Script URL"});return;}
    localStorage.setItem("ims_sheeturl",url.trim());
    setSyncing(true);setStatus(null);
    try{
      const payload={
        products:products.map(p=>({code:p.code,name:p.name,unit:p.unit,qty:p.qty,minQty:p.minQty,maxQty:p.maxQty,status:p.qty<p.minQty?"ต่ำกว่ากำหนด":"ปกติ"})),
        receives:receives.map(r=>({date:r.date,time:r.time||"",productCode:r.productCode,productName:r.productName,qty:r.qty,price:r.price,totalPrice:r.totalPrice,sourceType:r.sourceType,sourceName:r.sourceName||"",buyer:r.buyer})),
        issues:issues.map(i=>({date:i.date,time:i.time||"",productCode:i.productCode,productName:i.productName,qty:i.qty,requester:i.requester,department:i.department||""})),
      };
      await fetch(url.trim(),{method:"POST",body:JSON.stringify(payload),mode:"no-cors"});
      setStatus({ok:true,msg:"✅ ส่งข้อมูลไป Google Sheet แล้ว! (กรุณาตรวจสอบใน Sheet)"});
    }catch(e){
      setStatus({ok:false,msg:"❌ เชื่อมต่อไม่ได้ กรุณาตรวจสอบ URL"});
    }
    setSyncing(false);
  };

  const code=`function doPost(e) {
  try {
    var data = JSON.parse(e.postData.contents);
    var ss = SpreadsheetApp.getActiveSpreadsheet();
    var sh;

    sh = ss.getSheetByName("สต็อก") || ss.insertSheet("สต็อก");
    sh.clearContents();
    sh.appendRow(["รหัส","ชื่อสินค้า","หน่วย","คงเหลือ","ขั้นต่ำ","สูงสุด","สถานะ"]);
    data.products.forEach(function(r){sh.appendRow([r.code,r.name,r.unit,r.qty,r.minQty,r.maxQty,r.status]);});

    sh = ss.getSheetByName("รับสินค้า") || ss.insertSheet("รับสินค้า");
    sh.clearContents();
    sh.appendRow(["วันที่","เวลา","รหัส","ชื่อสินค้า","จำนวน","ราคา/หน่วย","รวม","ประเภท","ร้านค้า","ผู้รับ"]);
    data.receives.forEach(function(r){sh.appendRow([r.date,r.time,r.productCode,r.productName,r.qty,r.price,r.totalPrice,r.sourceType,r.sourceName,r.buyer]);});

    sh = ss.getSheetByName("เบิกสินค้า") || ss.insertSheet("เบิกสินค้า");
    sh.clearContents();
    sh.appendRow(["วันที่","เวลา","รหัส","ชื่อสินค้า","จำนวน","ผู้เบิก","แผนก"]);
    data.issues.forEach(function(r){sh.appendRow([r.date,r.time,r.productCode,r.productName,r.qty,r.requester,r.department]);});

    return ContentService.createTextOutput("ok").setMimeType(ContentService.MimeType.TEXT);
  } catch(err) {
    return ContentService.createTextOutput("err:"+err).setMimeType(ContentService.MimeType.TEXT);
  }
}`;

  return(
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,.55)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:300,fontFamily:"inherit"}} onClick={onClose}>
      <div style={{background:"#fff",borderRadius:14,padding:24,maxWidth:520,width:"95%",maxHeight:"90vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
        <div style={{fontWeight:700,fontSize:16,color:"#1e3a5f",marginBottom:4}}>🔗 Sync ข้อมูลไป Google Sheet</div>
        <div style={{color:"#888",fontSize:12,marginBottom:14}}>ส่งข้อมูลสต็อก, รับ, เบิก ไปอัปเดต Google Sheet</div>
        <div style={{background:"#f0fff4",border:"1px solid #9ae6b4",borderRadius:8,padding:12,marginBottom:12,fontSize:12}}>
          <div style={{fontWeight:700,color:"#276749",marginBottom:8}}>📋 วิธีตั้งค่า (ทำครั้งเดียว)</div>
          {["เปิด Google Sheet ใหม่ → Extensions → Apps Script","ลบ code เดิมทั้งหมด แล้ววาง code ด้านล่าง","กด Save → Deploy → New deployment","Web app: Execute as Me, Access: Anyone → Deploy","คัดลอก URL ที่ได้มาวางด้านล่าง"].map((t,i)=><div key={i} style={{display:"flex",gap:8,marginBottom:4,alignItems:"flex-start"}}><span style={{background:"#276749",color:"#fff",borderRadius:"50%",width:18,height:18,fontSize:10,display:"flex",alignItems:"center",justifyContent:"center",flexShrink:0,lineHeight:"18px",textAlign:"center"}}>{i+1}</span><span>{t}</span></div>)}
        </div>
        <div style={{marginBottom:12,position:"relative"}}>
          <Lbl c="#555">Apps Script Code</Lbl>
          <textarea readOnly value={code} style={{...inp({height:100,fontSize:10,fontFamily:"monospace",background:"#1a202c",color:"#68d391",resize:"none",padding:8})}}/>
          <button onClick={()=>navigator.clipboard?.writeText(code)} style={btn("#38a169","#fff",{position:"absolute",bottom:8,right:8,fontSize:10,padding:"3px 8px"})}>คัดลอก Code</button>
        </div>
        <div style={{marginBottom:12}}>
          <Lbl c="#555">Web App URL (จาก Deploy)</Lbl>
          <input value={url} onChange={e=>setUrl(e.target.value)} placeholder="https://script.google.com/macros/s/..." style={inp({fontSize:12})}/>
        </div>
        {status&&<div style={{background:status.ok?"#f0fff4":"#fff5f5",border:`1px solid ${status.ok?"#9ae6b4":"#fc8181"}`,borderRadius:8,padding:"8px 12px",marginBottom:12,fontSize:13,color:status.ok?"#276749":"#c53030"}}>{status.msg}</div>}
        <div style={{display:"flex",gap:8}}>
          <button onClick={doSync} disabled={syncing} style={btn("#1e3a5f","#fff",{flex:1,opacity:syncing?.7:1})}>{syncing?"⏳ กำลัง Sync...":"🚀 Sync ไป Google Sheet"}</button>
          <button onClick={onClose} style={btn("#718096","#fff")}>ปิด</button>
        </div>
      </div>
    </div>
  );
}

// ======== LOGIN ========
function LoginScreen({onLogin}){
  const [u,setU]=useState(""); const [p,setP]=useState(""); const [show,setShow]=useState(false); const [err,setErr]=useState("");
  const go=()=>{const user=USERS.find(x=>x.username===u&&x.password===p);user?onLogin(user):setErr("ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง");};
  return(
    <div style={{minHeight:"100vh",background:"linear-gradient(135deg,#1e3a5f,#2d6a9f)",display:"flex",alignItems:"center",justifyContent:"center"}}>
      <div style={{background:"#fff",borderRadius:16,padding:"36px 32px",width:"100%",maxWidth:380,boxShadow:"0 20px 60px rgba(0,0,0,.3)"}}>
        <div style={{textAlign:"center",marginBottom:28}}><div style={{fontSize:52}}>📦</div><div style={{fontWeight:700,fontSize:20,color:"#1e3a5f"}}>ระบบจัดการสต็อกสินค้า</div><div style={{color:"#888",fontSize:13,marginTop:4}}>กรุณาเข้าสู่ระบบ</div></div>
        {err&&<div style={{background:"#fff5f5",border:"1px solid #fc8181",borderRadius:8,padding:"8px 12px",marginBottom:14,color:"#c53030",fontSize:13}}>❌ {err}</div>}
        <div style={{marginBottom:14}}><Lbl>ชื่อผู้ใช้</Lbl><input value={u} onChange={e=>{setU(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="กรอกชื่อผู้ใช้" style={inp({fontSize:14,padding:"10px 12px"})}/></div>
        <div style={{marginBottom:20}}><Lbl>รหัสผ่าน</Lbl><div style={{position:"relative"}}><input type={show?"text":"password"} value={p} onChange={e=>{setP(e.target.value);setErr("");}} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="กรอกรหัสผ่าน" style={inp({fontSize:14,padding:"10px 40px 10px 12px"})}/><button onClick={()=>setShow(v=>!v)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",cursor:"pointer",fontSize:16}}>{show?"🙈":"👁️"}</button></div></div>
        <button onClick={go} style={btn("#1e3a5f","#fff",{width:"100%",padding:11,fontSize:15})}>🔐 เข้าสู่ระบบ</button>
        <div style={{marginTop:20,padding:14,background:"#f7fafc",borderRadius:8,fontSize:12,color:"#666"}}><div style={{fontWeight:600,marginBottom:6,color:"#4a5568"}}>👤 บัญชีทดลองใช้</div><div>Admin: <b>admin</b> / <b>admin1234</b></div><div style={{marginTop:2}}>คลัง: <b>store</b> / <b>store1234</b></div></div>
      </div>
    </div>
  );
}

// ======== APP ========
function App(){
  const [currentUser,setCurrentUser]=useState(null);
  const [tab,setTab]=useState(0);
  const [products,setProducts]=useState(()=>loadDB("products")||initProducts);
  const [receives,setReceives]=useState(()=>loadDB("receives")||[]);
  const [issues,setIssues]=useState(()=>loadDB("issues")||[]);
  const [movements,setMovements]=useState(()=>loadDB("movements")||[]);
  const [prodHistory,setProdHistory]=useState(()=>loadDB("prodhistory")||{});
  const [toast,setToast]=useState(null);
  const [showSheet,setShowSheet]=useState(false);

  const showToast=(msg,type="success")=>{setToast({msg,type});setTimeout(()=>setToast(null),3200);};

  const saveProds=p=>{setProducts(p);saveDB("products",p);};
  const saveRecvs=r=>{setReceives(r);saveDB("receives",r);};
  const saveIssues=i=>{setIssues(i);saveDB("issues",i);};
  const saveMovs=m=>{setMovements(m);saveDB("movements",m);};
  const savePH=ph=>{setProdHistory(ph);saveDB("prodhistory",ph);};

  if(!currentUser)return <LoginScreen onLogin={u=>{setCurrentUser(u);setTab(0);}}/>;

  const lowStock=products.filter(p=>p.qty<p.minQty);
  const todaySpend=receives.filter(r=>r.date===todayStr()).reduce((s,r)=>s+(Number(r.price)||0)*(Number(r.qty)||0),0);

  return(
    <div style={{fontFamily:"inherit",minHeight:"100vh",background:"#f0f4f8"}}>
      <div style={{background:"#1e3a5f",color:"#fff",padding:"10px 18px",display:"flex",alignItems:"center",gap:10,flexWrap:"wrap"}}>
        <span style={{fontSize:20}}>📦</span>
        <span style={{fontWeight:700,fontSize:16}}>ระบบจัดการสต็อกสินค้า</span>
        {lowStock.length>0&&<span style={{background:"#e53e3e",borderRadius:20,padding:"2px 10px",fontSize:11}}>⚠️ สต็อกต่ำ {lowStock.length} รายการ</span>}
        <div style={{marginLeft:"auto",display:"flex",alignItems:"center",gap:8,flexWrap:"wrap"}}>
          <button onClick={()=>setShowSheet(true)} style={btn("#38a169","#fff",{fontSize:11,padding:"4px 10px"})}>🔗 Sync Sheet</button>
          <div style={{fontSize:12,textAlign:"right"}}>
            <div style={{opacity:.8}}>{currentUser.role==="admin"?"👑 Admin":"🏪 พนักงานคลัง"}</div>
            <div style={{fontWeight:600}}>{currentUser.displayName}</div>
          </div>
          <button onClick={()=>setCurrentUser(null)} style={btn("#e53e3e","#fff",{fontSize:11,padding:"4px 10px"})}>ออกจากระบบ</button>
        </div>
      </div>
      <div style={{display:"flex",background:"#fff",borderBottom:"2px solid #e2e8f0",overflowX:"auto"}}>
        {TABS.map((t,i)=><button key={i} onClick={()=>setTab(i)} style={{padding:"10px 16px",border:"none",background:"none",cursor:"pointer",fontFamily:"inherit",fontSize:13,fontWeight:tab===i?700:400,color:tab===i?"#1e3a5f":"#555",borderBottom:tab===i?"3px solid #1e3a5f":"3px solid transparent",whiteSpace:"nowrap"}}>{t}</button>)}
      </div>
      <div style={{padding:"14px 12px",maxWidth:1000,margin:"0 auto"}}>
        {tab===0&&<Dashboard products={products} receives={receives} issues={issues} lowStock={lowStock} todaySpend={todaySpend} setTab={setTab}/>}
        {tab===1&&<ProductsTab products={products} saveProds={saveProds} prodHistory={prodHistory} savePH={savePH} receives={receives} issues={issues} showToast={showToast}/>}
        {tab===2&&<ReceiveTab products={products} saveProds={saveProds} receives={receives} saveRecvs={saveRecvs} movements={movements} saveMovs={saveMovs} prodHistory={prodHistory} savePH={savePH} showToast={showToast} currentUser={currentUser}/>}
        {tab===3&&<IssueTab products={products} saveProds={saveProds} issues={issues} saveIssues={saveIssues} movements={movements} saveMovs={saveMovs} showToast={showToast} currentUser={currentUser}/>}
        {tab===4&&<ReportTab products={products} receives={receives} issues={issues} movements={movements}/>}
      </div>
      {showSheet&&<SheetSyncModal onClose={()=>setShowSheet(false)} products={products} receives={receives} issues={issues}/>}
      {toast&&<div style={{position:"fixed",bottom:24,right:24,background:toast.type==="success"?"#38a169":"#e53e3e",color:"#fff",padding:"10px 20px",borderRadius:8,boxShadow:"0 4px 12px rgba(0,0,0,.25)",zIndex:400,fontSize:13}}>{toast.type==="success"?"✅":"❌"} {toast.msg}</div>}
    </div>
  );
}

// ======== DASHBOARD ========
function Dashboard({products,receives,issues,lowStock,todaySpend,setTab}){
  const tR=receives.filter(r=>r.date===todayStr()).reduce((s,r)=>s+Number(r.qty||0),0);
  const tI=issues.filter(r=>r.date===todayStr()).reduce((s,r)=>s+Number(r.qty||0),0);
  return(
    <div>

        {[{l:"สินค้าทั้งหมด",v:products.length+" รายการ",icon:"📋",c:"#3182ce"},{l:"ค่าใช้จ่ายวันนี้",v:"฿"+fmt(todaySpend),icon:"💸",c:"#805ad5"},{l:"รับเข้าวันนี้",v:fmt(tR)+" ชิ้น",icon:"📥",c:"#38a169"},{l:"เบิกออกวันนี้",v:fmt(tI)+" ชิ้น",icon:"📤",c:"#dd6b20"},{l:"สต็อกต่ำกว่ากำหนด",v:lowStock.length+" รายการ",icon:"⚠️",c:"#e53e3e"}].map((c,i)=>(

              <td style={{padding:"6px 8px"}}><span style={{background:p.qty<p.minQty?"#fed7d7":"#c6f6d5",color:p.qty<p.minQty?"#c53030":"#276749",borderRadius:12,padding:"2px 8px",fontSize:10}}>{p.qty<p.minQty?"⚠️ ต่ำ":"✅ ปกติ"}</span></td>

}

// ======== PRODUCTS TAB ========
function ProductsTab({products,saveProds,prodHistory,savePH,receives,issues,showToast}){
  const [search,setSearch]=useState("");
  const [showForm,setShowForm]=useState(false);
  const [editId,setEditId]=useState(null);
  const [viewHist,setViewHist]=useState(null);
  const [viewer,setViewer]=useState(null);
  const empty={code:"",name:"",unit:"",qty:0,minQty:0,maxQty:0,image:null,initPrice:0,initSourceType:"ร้านค้าทั่วไป",initSourceName:"",initBuyer:"",initDate:todayStr()};
  const [form,setForm]=useState(empty);
  const [preview,setPreview]=useState(null);

  const handleImg=async e=>{const f=e.target.files[0];if(!f)return;const d=await readImg(f);setPreview(d);setForm(fm=>({...fm,image:d}));};
  const handleSave=()=>{
    if(!form.code||!form.name){showToast("กรุณากรอกรหัสและชื่อสินค้า","error");return;}
    if(editId){
      saveProds(products.map(p=>p.id===editId?{...p,...form,qty:Number(form.qty),minQty:Number(form.minQty),maxQty:Number(form.maxQty)}:p));
      showToast("แก้ไขสินค้าเรียบร้อย");
    }else{
      const newP={...form,id:Date.now(),qty:Number(form.qty),minQty:Number(form.minQty),maxQty:Number(form.maxQty)};
      saveProds([...products,newP]);
      if(Number(form.initPrice)>0||form.initSourceName||form.initBuyer){
        const e2={id:Date.now(),price:Number(form.initPrice),sourceType:form.initSourceType,sourceName:form.initSourceName,buyer:form.initBuyer,date:form.initDate,qty:Number(form.qty),note:"เพิ่มสินค้าครั้งแรก"};
        const nh={...prodHistory,[newP.id]:[e2,...(prodHistory[newP.id]||[])]};
        savePH(nh);
      }
      showToast("เพิ่มสินค้าเรียบร้อย");
    }
    setShowForm(false);setEditId(null);setForm(empty);setPreview(null);
  };
  const handleEdit=p=>{setForm({...p,initPrice:0,initSourceType:"ร้านค้าทั่วไป",initSourceName:"",initBuyer:"",initDate:todayStr()});setPreview(p.image||null);setEditId(p.id);setShowForm(true);};
  const handleDel=id=>{if(!window.confirm("ยืนยันลบสินค้านี้?"))return;saveProds(products.filter(p=>p.id!==id));showToast("ลบสินค้าเรียบร้อย");};
  const filtered=products.filter(p=>p.name.includes(search)||p.code.includes(search));
  const getRH=pid=>receives.filter(r=>r.productId===pid);
  const getIH=pid=>issues.filter(i=>i.productId===pid);

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap"}}>
        <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="🔍 ค้นหาสินค้า..." style={inp({flex:1,minWidth:160})}/>
        <button onClick={()=>{setShowForm(true);setEditId(null);setForm(empty);setPreview(null);}} style={btn("#1e3a5f","#fff")}>+ เพิ่มสินค้า</button>
      </div>
      {showForm&&(
        <Card style={{marginBottom:12}}>
          <div style={{fontWeight:700,color:"#1e3a5f",marginBottom:12}}>{editId?"✏️ แก้ไขสินค้า":"➕ เพิ่มสินค้าใหม่"}</div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
            {[["code","รหัสสินค้า","text"],["name","ชื่อสินค้า","text"],["unit","หน่วย","text"],["qty","จำนวนเริ่มต้น","number"],["minQty","จำนวนขั้นต่ำ","number"],["maxQty","จำนวนสูงสุด","number"]].map(([k,l,t])=>(
              <div key={k}><Lbl>{l}</Lbl><input type={t} value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} style={inp()}/></div>
            ))}
          </div>
          {!editId&&<>
            <div style={{margin:"12px 0 8px",fontWeight:600,color:"#4a5568",fontSize:13,borderTop:"1px solid #e2e8f0",paddingTop:10}}>📋 ข้อมูลการซื้อครั้งแรก (ถ้ามี)</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
              <div><Lbl>ราคา/หน่วย</Lbl><input type="number" value={form.initPrice} onChange={e=>setForm(f=>({...f,initPrice:e.target.value}))} style={inp()}/></div>
              <div><Lbl>วันที่ซื้อ</Lbl><input type="date" value={form.initDate} onChange={e=>setForm(f=>({...f,initDate:e.target.value}))} style={inp()}/></div>
              <div><Lbl>ประเภทแหล่งที่ซื้อ</Lbl><select value={form.initSourceType} onChange={e=>setForm(f=>({...f,initSourceType:e.target.value}))} style={inp()}>{SOURCE_TYPES.map(x=><option key={x}>{x}</option>)}</select></div>
              <div><Lbl>ชื่อร้าน</Lbl><input value={form.initSourceName} onChange={e=>setForm(f=>({...f,initSourceName:e.target.value}))} placeholder="เช่น Shopee, BigC..." style={inp()}/></div>
              <div style={{gridColumn:"1/-1"}}><Lbl>คนที่ไปซื้อ</Lbl><input value={form.initBuyer} onChange={e=>setForm(f=>({...f,initBuyer:e.target.value}))} style={inp()}/></div>
            </div>
          </>}
          <div style={{marginTop:10}}><Lbl>รูปภาพสินค้า</Lbl><input type="file" accept="image/*" onChange={handleImg} style={{fontSize:12}}/>{preview&&<img src={preview} style={{width:80,height:80,objectFit:"cover",borderRadius:8,marginTop:6,display:"block"}} alt="p"/>}</div>
          <div style={{display:"flex",gap:8,marginTop:12}}>
            <button onClick={handleSave} style={btn("#38a169","#fff")}>💾 บันทึก</button>
            <button onClick={()=>setShowForm(false)} style={btn("#718096","#fff")}>ยกเลิก</button>
          </div>
        </Card>
      )}
      <Card>
        <div style={{overflowX:"auto"}}>
          <table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{background:"#edf2f7"}}>{["รูป","รหัส","ชื่อสินค้า","คงเหลือ","หน่วย","ขั้นต่ำ/สูงสุด","สถานะ","จัดการ"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
            <tbody>{filtered.map(p=>(
              <tr key={p.id} style={{borderBottom:"1px solid #e2e8f0",background:p.qty<p.minQty?"#fff5f5":"#fff"}}>
                <td style={{padding:"4px 8px"}}>{p.image?<img src={p.image} onClick={()=>setViewer({images:[p.image],idx:0})} style={{width:40,height:40,objectFit:"cover",borderRadius:6,cursor:"pointer"}} alt=""/>:<span style={{fontSize:24}}>📦</span>}</td>
                <td style={{padding:"6px 8px"}}>{p.code}</td><td style={{padding:"6px 8px",fontWeight:600}}>{p.name}</td>
                <td style={{padding:"6px 8px",fontWeight:700,color:p.qty<p.minQty?"#e53e3e":"#38a169"}}>{fmt(p.qty)}</td>
                <td style={{padding:"6px 8px"}}>{p.unit}</td><td style={{padding:"6px 8px"}}>{fmt(p.minQty)}/{fmt(p.maxQty)}</td>
                <td style={{padding:"6px 8px"}}><span style={{background:p.qty<p.minQty?"#fed7d7":"#c6f6d5",color:p.qty<p.minQty?"#c53030":"#276749",borderRadius:12,padding:"2px 6px",fontSize:10}}>{p.qty<p.minQty?"⚠️ ต่ำ":"✅ ปกติ"}</span></td>
                <td style={{padding:"6px 8px"}}><div style={{display:"flex",gap:3,flexWrap:"wrap"}}>
                  <button onClick={()=>handleEdit(p)} style={btn("#3182ce","#fff",{fontSize:11,padding:"2px 7px"})}>แก้ไข</button>
                  <button onClick={()=>setViewHist({product:p,histTab:"buy"})} style={btn("#805ad5","#fff",{fontSize:11,padding:"2px 7px"})}>ประวัติ</button>
                  <button onClick={()=>handleDel(p.id)} style={btn("#e53e3e","#fff",{fontSize:11,padding:"2px 7px"})}>ลบ</button>
                </div></td>
              </tr>
            ))}</tbody>
          </table>
        </div>
      </Card>
      {viewHist&&(()=>{
        const p=viewHist.product;
        const buyList=prodHistory[p.id]||[];
        const recvList=getRH(p.id);
        const issueList=getIH(p.id);
        const htabs=[{k:"buy",l:`ประวัติการซื้อ (${buyList.length})`},{k:"recv",l:`ประวัติรับสินค้า (${recvList.length})`},{k:"issue",l:`ประวัติการเบิก (${issueList.length})`}];
        return(
          <Modal title={`📋 ประวัติสินค้า: ${p.name}`} onClose={()=>setViewHist(null)} wide>
            <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
              {htabs.map(ht=><button key={ht.k} onClick={()=>setViewHist(v=>({...v,histTab:ht.k}))} style={btn(viewHist.histTab===ht.k?"#805ad5":"#e2e8f0",viewHist.histTab===ht.k?"#fff":"#333",{fontSize:12,padding:"4px 10px"})}>{ht.l}</button>)}
            </div>
            {viewHist.histTab==="buy"&&(buyList.length===0?<div style={{color:"#aaa",textAlign:"center",padding:20}}>ยังไม่มีประวัติการซื้อ</div>:buyList.map((h,i)=>(
              <div key={i} style={{borderBottom:"1px solid #e2e8f0",padding:"8px 0",fontSize:13}}>
                <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600}}>{h.date}</span><span style={{color:"#805ad5",fontWeight:700}}>฿{fmt(h.price)}/หน่วย</span></div>
                <div style={{color:"#666"}}>จำนวน {fmt(h.qty)} | รวม ฿{fmt((h.price||0)*(h.qty||0))}</div>
                <div style={{color:"#888"}}>{h.sourceType} — {h.sourceName||"-"} | ผู้ซื้อ: {h.buyer||"-"}</div>
              </div>
            )))}
            {viewHist.histTab==="recv"&&(recvList.length===0?<div style={{color:"#aaa",textAlign:"center",padding:20}}>ยังไม่มีประวัติรับสินค้า</div>:recvList.map((r,i)=>(
              <div key={i} style={{borderBottom:"1px solid #e2e8f0",padding:"8px 0",fontSize:13}}>
                <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600}}>{r.date} {r.time||""}</span><span style={{color:"#38a169",fontWeight:700}}>+{fmt(r.qty)}</span></div>
                <div style={{color:"#666"}}>ผู้รับ: {r.buyer} | {r.sourceType} — {r.sourceName||"-"}</div>
                <ThumbRow images={r.attachImages||[]} onView={idx=>setViewer({images:r.attachImages,idx})}/>
              </div>
            )))}
            {viewHist.histTab==="issue"&&(issueList.length===0?<div style={{color:"#aaa",textAlign:"center",padding:20}}>ยังไม่มีประวัติการเบิก</div>:issueList.map((r,i)=>(
              <div key={i} style={{borderBottom:"1px solid #e2e8f0",padding:"8px 0",fontSize:13}}>
                <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600}}>{r.date} {r.time||""}</span><span style={{color:"#e53e3e",fontWeight:700}}>-{fmt(r.qty)}</span></div>
                <div style={{color:"#666"}}>ผู้เบิก: {r.requester} | แผนก: {r.department||"-"}</div>
                <ThumbRow images={r.attachImages||[]} onView={idx=>setViewer({images:r.attachImages,idx})}/>
              </div>
            )))}
          </Modal>
        );
      })()}
      {viewer&&<ImageViewer images={viewer.images} startIdx={viewer.idx} onClose={()=>setViewer(null)}/>}
    </div>
  );
}

// ======== RECEIVE TAB ========
function ReceiveTab({products,saveProds,receives,saveRecvs,movements,saveMovs,prodHistory,savePH,showToast,currentUser}){
  const ef=()=>({productId:"",sourceType:"ร้านค้าทั่วไป",sourceName:"",qty:"",price:"",buyer:currentUser.displayName,date:todayStr(),time:nowTime(),note:"",attachImages:[]});
  const [form,setForm]=useState(ef());
  const [editId,setEditId]=useState(null);
  const [viewRec,setViewRec]=useState(null);
  const [viewer,setViewer]=useState(null);
  const reset=()=>{setForm(ef());setEditId(null);};

  const handleSubmit=()=>{
    if(!form.productId||!form.qty||!form.buyer){showToast("กรุณากรอกข้อมูลให้ครบ","error");return;}
    const prod=products.find(p=>p.id===Number(form.productId));
    const qn=Number(form.qty),pn=Number(form.price)||0;
    if(editId){
      const old=receives.find(r=>r.id===editId);
      const diff=qn-(old.qty||0);
      saveProds(products.map(p=>p.id===Number(form.productId)?{...p,qty:p.qty+diff}:p));
      saveRecvs(receives.map(r=>r.id===editId?{...r,...form,qty:qn,price:pn,totalPrice:qn*pn,productCode:prod.code,productName:prod.name}:r));
      showToast("แก้ไขรายการเรียบร้อย");
    }else{
      const rec={id:Date.now(),productId:Number(form.productId),productCode:prod.code,productName:prod.name,sourceType:form.sourceType,sourceName:form.sourceName,qty:qn,price:pn,totalPrice:qn*pn,buyer:form.buyer,date:form.date,time:form.time,note:form.note,attachImages:form.attachImages||[]};
      saveProds(products.map(p=>p.id===Number(form.productId)?{...p,qty:p.qty+qn}:p));
      saveRecvs([rec,...receives]);
      saveMovs([{id:Date.now(),type:"รับเข้า",productCode:prod.code,productName:prod.name,qty:qn,by:form.buyer,date:form.date,time:form.time},...movements]);
      const entry={id:rec.id,price:pn,sourceType:form.sourceType,sourceName:form.sourceName,buyer:form.buyer,date:form.date,qty:qn};
      savePH({...prodHistory,[prod.id]:[entry,...(prodHistory[prod.id]||[])]});
      showToast(`รับสินค้า "${prod.name}" จำนวน ${qn} เรียบร้อย`);
    }
    reset();
  };

  const handleEdit=r=>{setForm({...r,productId:r.productId,attachImages:r.attachImages||[]});setEditId(r.id);};
  const handleDel=id=>{
    if(!window.confirm("ยืนยันลบ?"))return;
    const old=receives.find(r=>r.id===id);
    saveProds(products.map(p=>p.id===old.productId?{...p,qty:p.qty-(old.qty||0)}:p));
    saveRecvs(receives.filter(r=>r.id!==id));
    showToast("ลบรายการเรียบร้อย");
  };

  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Card>
          <div style={{fontWeight:700,color:"#1e3a5f",marginBottom:12}}>{editId?"✏️ แก้ไขรายการรับสินค้า":"📥 บันทึกรับสินค้าเข้า"}</div>
          <div style={{marginBottom:8}}><Lbl>สินค้า</Lbl><select value={form.productId} onChange={e=>setForm(f=>({...f,productId:e.target.value}))} style={inp()}><option value="">-- เลือกสินค้า --</option>{products.map(p=><option key={p.id} value={p.id}>{p.code} — {p.name} (เหลือ {p.qty})</option>)}</select></div>
          <div style={{marginBottom:8}}><Lbl>ประเภทแหล่งที่ซื้อ</Lbl><select value={form.sourceType} onChange={e=>setForm(f=>({...f,sourceType:e.target.value}))} style={inp()}>{SOURCE_TYPES.map(x=><option key={x}>{x}</option>)}</select></div>
          <div style={{marginBottom:8}}><Lbl>ชื่อร้าน / แหล่งที่ซื้อ</Lbl><input value={form.sourceName} onChange={e=>setForm(f=>({...f,sourceName:e.target.value}))} placeholder="เช่น Shopee, BigC..." style={inp()}/></div>
          {[["qty","จำนวนที่รับ","number"],["price","ราคา/หน่วย (บาท)","number"],["buyer","คนที่ไปซื้อ / ผู้รับ","text"]].map(([k,l,t])=>(
            <div key={k} style={{marginBottom:8}}><Lbl>{l}</Lbl><input type={t} value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} style={inp()}/></div>
          ))}
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><Lbl>วันที่รับ</Lbl><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={inp()}/></div>
            <div><Lbl>เวลาที่รับ</Lbl><input type="time" value={form.time} onChange={e=>setForm(f=>({...f,time:e.target.value}))} style={inp()}/></div>
          </div>
          <div style={{marginBottom:8}}><Lbl>หมายเหตุ</Lbl><input value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} style={inp()}/></div>
          <div style={{marginBottom:10}}><AttachImages images={form.attachImages||[]} onChange={imgs=>setForm(f=>({...f,attachImages:imgs}))}/></div>
          {form.qty&&form.price&&<div style={{background:"#ebf8ff",borderRadius:8,padding:"8px 12px",marginBottom:8,fontSize:13,color:"#2b6cb0"}}>💸 รวมจ่าย: <b>฿{fmt(Number(form.qty)*Number(form.price))}</b></div>}
          <div style={{display:"flex",gap:8}}>
            <button onClick={handleSubmit} style={btn("#38a169","#fff",{flex:1})}>✅ {editId?"บันทึกแก้ไข":"บันทึกรับสินค้า"}</button>
            {editId&&<button onClick={reset} style={btn("#718096","#fff")}>ยกเลิก</button>}
          </div>
        </Card>
        <Card>
          <div style={{fontWeight:700,color:"#1e3a5f",marginBottom:8}}>📋 ประวัติรับสินค้า</div>
          <div style={{overflowY:"auto",maxHeight:520}}>
            {receives.length===0?<div style={{color:"#aaa",textAlign:"center",marginTop:40}}>ยังไม่มีรายการ</div>:
            receives.slice(0,50).map(r=>(
              <div key={r.id} style={{borderBottom:"1px solid #e2e8f0",padding:"8px 0",fontSize:12}}>
                <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600}}>{r.productCode} — {r.productName}</span><span style={{color:"#888",fontSize:11}}>{r.date} {r.time||""}</span></div>
                <div style={{color:"#666"}}>จำนวน: <b style={{color:"#38a169"}}>{fmt(r.qty)}</b> | {r.sourceType} — {r.sourceName||"-"}</div>
                <div style={{color:"#888"}}>ผู้รับ: {r.buyer}</div>
                <ThumbRow images={r.attachImages||[]} onView={idx=>setViewer({images:r.attachImages,idx})}/>
                <div style={{display:"flex",gap:4,marginTop:5}}>
                  <button onClick={()=>setViewRec(r)} style={btn("#805ad5","#fff",{fontSize:10,padding:"2px 8px"})}>ดูราคา</button>
                  <button onClick={()=>handleEdit(r)} style={btn("#3182ce","#fff",{fontSize:10,padding:"2px 8px"})}>แก้ไข</button>
                  <button onClick={()=>handleDel(r.id)} style={btn("#e53e3e","#fff",{fontSize:10,padding:"2px 8px"})}>ลบ</button>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>
      {viewRec&&<Modal title="🔍 รายละเอียดการซื้อ" onClose={()=>setViewRec(null)}>
        {[["สินค้า",`${viewRec.productCode} — ${viewRec.productName}`],["วันที่/เวลา",`${viewRec.date} ${viewRec.time||""}`],["จำนวน",`${fmt(viewRec.qty)} ชิ้น`],["ราคา/หน่วย",`฿${fmt(viewRec.price)}`],["รวมจ่าย",`฿${fmt(viewRec.totalPrice)}`],["แหล่งที่ซื้อ",`${viewRec.sourceType} — ${viewRec.sourceName||"-"}`],["คนที่ไปซื้อ",viewRec.buyer],["หมายเหตุ",viewRec.note||"-"]].map(([l,v])=>(
          <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"5px 0",borderBottom:"1px solid #e2e8f0",fontSize:13}}><span style={{color:"#666"}}>{l}</span><span style={{fontWeight:600,color:"#1e3a5f"}}>{v}</span></div>
        ))}
        {(viewRec.attachImages||[]).length>0&&<div style={{marginTop:10}}><Lbl c="#555">📎 รูปภาพแนบ</Lbl><div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:6}}>{(viewRec.attachImages||[]).map((img,i)=><img key={i} src={img} onClick={()=>setViewer({images:viewRec.attachImages,idx:i})} style={{width:72,height:72,objectFit:"cover",borderRadius:7,cursor:"pointer",border:"1px solid #e2e8f0"}} alt="r"/>)}</div></div>}
      </Modal>}
      {viewer&&<ImageViewer images={viewer.images} startIdx={viewer.idx} onClose={()=>setViewer(null)}/>}
    </div>
  );
}

// ======== ISSUE TAB ========
function IssueTab({products,saveProds,issues,saveIssues,movements,saveMovs,showToast,currentUser}){
  const ef=()=>({productId:"",qty:"",requester:currentUser.displayName,department:"",date:todayStr(),time:nowTime(),note:"",attachImages:[]});
  const [form,setForm]=useState(ef());
  const [editId,setEditId]=useState(null);
  const [viewIss,setViewIss]=useState(null);
  const [viewer,setViewer]=useState(null);
  const reset=()=>{setForm(ef());setEditId(null);};

  const handleSubmit=()=>{
    if(!form.productId||!form.qty||!form.requester){showToast("กรุณากรอกข้อมูลให้ครบ","error");return;}
    const prod=products.find(p=>p.id===Number(form.productId));
    const qn=Number(form.qty);
    if(editId){
      const old=issues.find(i=>i.id===editId);
      const diff=qn-(old.qty||0);
      if(prod.qty-diff<0){showToast("สินค้าไม่เพียงพอ","error");return;}
      saveProds(products.map(p=>p.id===Number(form.productId)?{...p,qty:p.qty-diff}:p));
      saveIssues(issues.map(i=>i.id===editId?{...i,...form,qty:qn}:i));
      showToast("แก้ไขรายการเรียบร้อย");
    }else{
      if(qn>prod.qty){showToast(`สินค้าไม่พอ เหลือ ${prod.qty} ${prod.unit}`,"error");return;}
      const iss={id:Date.now(),productId:Number(form.productId),productCode:prod.code,productName:prod.name,qty:qn,requester:form.requester,department:form.department,date:form.date,time:form.time,note:form.note,attachImages:form.attachImages||[]};
      saveProds(products.map(p=>p.id===Number(form.productId)?{...p,qty:p.qty-qn}:p));
      saveIssues([iss,...issues]);
      saveMovs([{id:Date.now(),type:"เบิกออก",productCode:prod.code,productName:prod.name,qty:-qn,by:form.requester,dept:form.department,date:form.date,time:form.time},...movements]);
      showToast(`เบิก "${prod.name}" จำนวน ${qn} เรียบร้อย`);
    }
    reset();
  };

  const handleEdit=r=>{setForm({...r,productId:r.productId,attachImages:r.attachImages||[]});setEditId(r.id);};
  const handleDel=id=>{
    if(!window.confirm("ยืนยันลบ?"))return;
    const old=issues.find(i=>i.id===id);
    saveProds(products.map(p=>p.id===old.productId?{...p,qty:p.qty+(old.qty||0)}:p));
    saveIssues(issues.filter(i=>i.id!==id));
    showToast("ลบรายการเรียบร้อย");
  };

  return(
    <div>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12}}>
        <Card>
          <div style={{fontWeight:700,color:"#1e3a5f",marginBottom:12}}>{editId?"✏️ แก้ไขรายการเบิก":"📤 บันทึกเบิกสินค้า"}</div>
          <div style={{marginBottom:8}}><Lbl>สินค้า</Lbl><select value={form.productId} onChange={e=>setForm(f=>({...f,productId:e.target.value}))} style={inp()}><option value="">-- เลือกสินค้า --</option>{products.map(p=><option key={p.id} value={p.id}>{p.code} — {p.name} (เหลือ {p.qty} {p.unit})</option>)}</select></div>
          {[["qty","จำนวนที่เบิก","number"],["requester","ผู้เบิก","text"]].map(([k,l,t])=>(
            <div key={k} style={{marginBottom:8}}><Lbl>{l}</Lbl><input type={t} value={form[k]} onChange={e=>setForm(f=>({...f,[k]:e.target.value}))} style={inp()}/></div>
          ))}
          <div style={{marginBottom:8}}><Lbl>แผนก</Lbl><select value={form.department} onChange={e=>setForm(f=>({...f,department:e.target.value}))} style={inp()}><option value="">-- เลือกแผนก --</option>{DEPARTMENTS.map(d=><option key={d}>{d}</option>)}</select></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
            <div><Lbl>วันที่เบิก</Lbl><input type="date" value={form.date} onChange={e=>setForm(f=>({...f,date:e.target.value}))} style={inp()}/></div>
            <div><Lbl>เวลาที่เบิก</Lbl><input type="time" value={form.time} onChange={e=>setForm(f=>({...f,time:e.target.value}))} style={inp()}/></div>
          </div>
          <div style={{marginBottom:8}}><Lbl>หมายเหตุ</Lbl><input value={form.note} onChange={e=>setForm(f=>({...f,note:e.target.value}))} style={inp()}/></div>
          <div style={{marginBottom:10}}><AttachImages images={form.attachImages||[]} onChange={imgs=>setForm(f=>({...f,attachImages:imgs}))}/></div>
          <div style={{display:"flex",gap:8}}>
            <button onClick={handleSubmit} style={btn("#dd6b20","#fff",{flex:1})}>✅ {editId?"บันทึกแก้ไข":"บันทึกเบิกสินค้า"}</button>
            {editId&&<button onClick={reset} style={btn("#718096","#fff")}>ยกเลิก</button>}
          </div>
        </Card>
        <Card>
          <div style={{fontWeight:700,color:"#1e3a5f",marginBottom:8}}>📋 ประวัติเบิกสินค้า</div>
          <div style={{overflowY:"auto",maxHeight:520}}>
            {issues.length===0?<div style={{color:"#aaa",textAlign:"center",marginTop:40}}>ยังไม่มีรายการ</div>:
            issues.slice(0,50).map(r=>(
              <div key={r.id} style={{borderBottom:"1px solid #e2e8f0",padding:"8px 0",fontSize:12}}>
                <div style={{display:"flex",justifyContent:"space-between"}}><span style={{fontWeight:600}}>{r.productCode} — {r.productName}</span><span style={{color:"#888",fontSize:11}}>{r.date} {r.time||""}</span></div>
                <div style={{color:"#666"}}>จำนวน: <b style={{color:"#e53e3e"}}>{fmt(r.qty)}</b> | แผนก: {r.department||"-"}</div>
                <div style={{color:"#888"}}>ผู้เบิก: {r.requester}</div>
                <ThumbRow images={r.attachImages||[]} onView={idx=>setViewer({images:r.attachImages,idx})}/>
                <div style={{display:"flex",gap:4,marginTop:5}}>
                  {(r.attachImages||[]).length>0&&<button onClick={()=>setViewIss(r)} style={btn("#805ad5","#fff",{fontSize:10,padding:"2px 8px"})}>ดูไฟล์แนบ</button>}
                  <button onClick={()=>handleEdit(r)} style={btn("#3182ce","#fff",{fontSize:10,padding:"2px 8px"})}>แก้ไข</button>
                  <button onClick={()=>handleDel(r.id)} style={btn("#e53e3e","#fff",{fontSize:10,padding:"2px 8px"})}>ลบ</button>
                </div>
              </div>
            ))}
          </div>
        </Card>
      </div>
      {viewIss&&<Modal title="📎 ไฟล์แนบการเบิก" onClose={()=>setViewIss(null)}>
        <div style={{fontSize:13,marginBottom:10}}><b>{viewIss.productCode} — {viewIss.productName}</b><br/>ผู้เบิก: {viewIss.requester} | แผนก: {viewIss.department||"-"}<br/>{viewIss.date} {viewIss.time||""}</div>
        <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>{(viewIss.attachImages||[]).map((img,i)=><img key={i} src={img} onClick={()=>setViewer({images:viewIss.attachImages,idx:i})} style={{width:80,height:80,objectFit:"cover",borderRadius:7,cursor:"pointer",border:"1px solid #e2e8f0"}} alt="v"/>)}</div>
      </Modal>}
      {viewer&&<ImageViewer images={viewer.images} startIdx={viewer.idx} onClose={()=>setViewer(null)}/>}
    </div>
  );
}

// ======== REPORT TAB ========
function ReportTab({products,receives,issues,movements}){
  const [rtype,setRtype]=useState("stock");
  const [df,setDf]=useState(""); const [dt,setDt]=useState("");
  const [viewer,setViewer]=useState(null);
  const fD=arr=>arr.filter(r=>(!df||r.date>=df)&&(!dt||r.date<=dt));
  const fR=fD(receives),fI=fD(issues),fM=fD(movements);
  const todaySpend=receives.filter(r=>r.date===todayStr()).reduce((s,r)=>s+(Number(r.price)||0)*(Number(r.qty)||0),0);
  const periodSpend=fR.reduce((s,r)=>s+(Number(r.price)||0)*(Number(r.qty)||0),0);

  const exportCSV=(rows,headers,filename)=>{
    const bom="\uFEFF";
    const csv=bom+[headers.join(","),...rows.map(r=>headers.map(h=>`"${(r[h]??'').toString().replace(/"/g,'""')}"`).join(","))].join("\n");
    const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=filename+".csv";a.click();
  };
  const doExport=()=>{
    if(rtype==="stock")exportCSV(products,["code","name","unit","qty","minQty","maxQty"],"stock");
    if(rtype==="receive")exportCSV(fR.map(r=>({...r,attachImages:`${(r.attachImages||[]).length} รูป`})),["date","time","productCode","productName","qty","price","totalPrice","sourceType","sourceName","buyer","note","attachImages"],"receive");
    if(rtype==="issue")exportCSV(fI.map(i=>({...i,attachImages:`${(i.attachImages||[]).length} รูป`})),["date","time","productCode","productName","qty","requester","department","note","attachImages"],"issue");
    if(rtype==="movement")exportCSV(fM,["date","time","type","productCode","productName","qty","by","dept"],"movement");
  };

  return(
    <div>
      <div style={{display:"flex",gap:8,marginBottom:12,flexWrap:"wrap",alignItems:"center"}}>
        {[["stock","📦 สต็อก"],["receive","📥 รับสินค้า"],["issue","📤 เบิกสินค้า"],["movement","🔄 การเคลื่อนไหว"]].map(([v,l])=>(
          <button key={v} onClick={()=>setRtype(v)} style={btn(rtype===v?"#1e3a5f":"#e2e8f0",rtype===v?"#fff":"#333",{fontSize:12})}>{l}</button>
        ))}
        <button onClick={doExport} style={btn("#38a169","#fff",{marginLeft:"auto"})}>⬇️ Export CSV</button>
      </div>
      {rtype!=="stock"&&<div style={{display:"flex",gap:8,marginBottom:12,alignItems:"center",flexWrap:"wrap",background:"#fff",padding:10,borderRadius:8}}>
        <span style={{fontSize:12,color:"#666"}}>กรองวันที่:</span>
        <input type="date" value={df} onChange={e=>setDf(e.target.value)} style={inp({width:140})}/>
        <span>—</span>
        <input type="date" value={dt} onChange={e=>setDt(e.target.value)} style={inp({width:140})}/>
        <button onClick={()=>{setDf("");setDt("");}} style={btn("#718096","#fff",{fontSize:12,padding:"5px 10px"})}>ล้าง</button>
      </div>}
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:12}}>
        {[{l:"ค่าใช้จ่ายวันนี้",v:"฿"+fmt(todaySpend),c:"#805ad5"},{l:"ค่าใช้จ่ายช่วงที่เลือก",v:"฿"+fmt(periodSpend),c:"#3182ce"},{l:"เบิกออกช่วงที่เลือก",v:fmt(fI.reduce((s,i)=>s+Number(i.qty||0),0))+" ชิ้น",c:"#dd6b20"}].map((c,i)=>(
          <div key={i} style={{background:"#fff",borderRadius:10,padding:14,textAlign:"center",boxShadow:"0 1px 4px rgba(0,0,0,.08)",borderTop:`3px solid ${c.c}`}}>
            <div style={{fontWeight:700,fontSize:16,color:c.c}}>{c.v}</div><div style={{color:"#666",fontSize:12}}>{c.l}</div>
          </div>
        ))}
      </div>
      <Card>
        <div style={{overflowX:"auto"}}>
          {rtype==="stock"&&<table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{background:"#edf2f7"}}>{["รูป","รหัส","ชื่อ","คงเหลือ","หน่วย","ขั้นต่ำ","สถานะ"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left"}}>{h}</th>)}</tr></thead>
            <tbody>{products.map(p=><tr key={p.id} style={{borderBottom:"1px solid #e2e8f0",background:p.qty<p.minQty?"#fff5f5":"#fff"}}>
              <td style={{padding:"4px 8px"}}>{p.image?<img src={p.image} style={{width:32,height:32,objectFit:"cover",borderRadius:4}} alt=""/>:<span>📦</span>}</td>
              <td style={{padding:"6px 8px"}}>{p.code}</td><td style={{padding:"6px 8px"}}>{p.name}</td>
              <td style={{padding:"6px 8px",fontWeight:700,color:p.qty<p.minQty?"#e53e3e":"#38a169"}}>{fmt(p.qty)}</td>
              <td style={{padding:"6px 8px"}}>{p.unit}</td><td style={{padding:"6px 8px"}}>{fmt(p.minQty)}</td>
              <td style={{padding:"6px 8px"}}><span style={{background:p.qty<p.minQty?"#fed7d7":"#c6f6d5",color:p.qty<p.minQty?"#c53030":"#276749",borderRadius:10,padding:"2px 6px",fontSize:10}}>{p.qty<p.minQty?"⚠️ ต่ำ":"✅ ปกติ"}</span></td>
            </tr>)}</tbody>
          </table>}
          {rtype==="receive"&&<table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{background:"#edf2f7"}}>{["วันที่","เวลา","รหัส","ชื่อ","จำนวน","ราคา","รวม","แหล่งที่ซื้อ","คนซื้อ","รูป"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left",whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
            <tbody>
              {fR.map(r=><tr key={r.id} style={{borderBottom:"1px solid #e2e8f0"}}>
                <td style={{padding:"6px 8px"}}>{r.date}</td><td style={{padding:"6px 8px"}}>{r.time||"-"}</td>
                <td style={{padding:"6px 8px"}}>{r.productCode}</td><td style={{padding:"6px 8px"}}>{r.productName}</td>
                <td style={{padding:"6px 8px",color:"#38a169",fontWeight:700}}>+{fmt(r.qty)}</td>
                <td style={{padding:"6px 8px"}}>฿{fmt(r.price)}</td><td style={{padding:"6px 8px",fontWeight:700}}>฿{fmt(r.totalPrice)}</td>
                <td style={{padding:"6px 8px"}}>{r.sourceType} — {r.sourceName||"-"}</td><td style={{padding:"6px 8px"}}>{r.buyer}</td>
                <td style={{padding:"4px 8px"}}><div style={{display:"flex",gap:3}}>{(r.attachImages||[]).map((img,i)=><img key={i} src={img} onClick={()=>setViewer({images:r.attachImages,idx:i})} style={{width:28,height:28,objectFit:"cover",borderRadius:4,cursor:"pointer"}} alt=""/>)}{!(r.attachImages||[]).length&&"-"}</div></td>
              </tr>)}
              <tr style={{background:"#ebf8ff",fontWeight:700}}><td colSpan={6} style={{padding:"6px 8px",textAlign:"right"}}>รวม</td><td style={{padding:"6px 8px",color:"#2b6cb0"}}>฿{fmt(periodSpend)}</td><td colSpan={3}></td></tr>
            </tbody>
          </table>}
          {rtype==="issue"&&<table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{background:"#edf2f7"}}>{["วันที่","เวลา","รหัส","ชื่อ","จำนวน","ผู้เบิก","แผนก","หมายเหตุ","รูป"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left"}}>{h}</th>)}</tr></thead>
            <tbody>{fI.map(r=><tr key={r.id} style={{borderBottom:"1px solid #e2e8f0"}}>
              <td style={{padding:"6px 8px"}}>{r.date}</td><td style={{padding:"6px 8px"}}>{r.time||"-"}</td>
              <td style={{padding:"6px 8px"}}>{r.productCode}</td><td style={{padding:"6px 8px"}}>{r.productName}</td>
              <td style={{padding:"6px 8px",color:"#e53e3e",fontWeight:700}}>-{fmt(r.qty)}</td>
              <td style={{padding:"6px 8px"}}>{r.requester}</td><td style={{padding:"6px 8px"}}>{r.department||"-"}</td><td style={{padding:"6px 8px"}}>{r.note||"-"}</td>
              <td style={{padding:"4px 8px"}}><div style={{display:"flex",gap:3}}>{(r.attachImages||[]).map((img,i)=><img key={i} src={img} onClick={()=>setViewer({images:r.attachImages,idx:i})} style={{width:28,height:28,objectFit:"cover",borderRadius:4,cursor:"pointer"}} alt=""/>)}{!(r.attachImages||[]).length&&"-"}</div></td>
            </tr>)}</tbody>
          </table>}
          {rtype==="movement"&&<table style={{width:"100%",borderCollapse:"collapse",fontSize:12}}>
            <thead><tr style={{background:"#edf2f7"}}>{["วันที่","เวลา","ประเภท","รหัส","ชื่อ","จำนวน","โดย","แผนก"].map(h=><th key={h} style={{padding:"6px 8px",textAlign:"left"}}>{h}</th>)}</tr></thead>
            <tbody>{fM.map(m=><tr key={m.id} style={{borderBottom:"1px solid #e2e8f0"}}>
              <td style={{padding:"6px 8px"}}>{m.date}</td><td style={{padding:"6px 8px"}}>{m.time||"-"}</td>
              <td style={{padding:"6px 8px"}}><span style={{background:m.type==="รับเข้า"?"#c6f6d5":"#fed7d7",color:m.type==="รับเข้า"?"#276749":"#c53030",borderRadius:10,padding:"2px 6px",fontSize:10}}>{m.type}</span></td>
              <td style={{padding:"6px 8px"}}>{m.productCode}</td><td style={{padding:"6px 8px"}}>{m.productName}</td>
              <td style={{padding:"6px 8px",fontWeight:700,color:m.qty>0?"#38a169":"#e53e3e"}}>{m.qty>0?"+":""}{fmt(m.qty)}</td>
              <td style={{padding:"6px 8px"}}>{m.by}</td><td style={{padding:"6px 8px"}}>{m.dept||"-"}</td>
            </tr>)}</tbody>
          </table>}
          {((rtype==="receive"&&fR.length===0)||(rtype==="issue"&&fI.length===0)||(rtype==="movement"&&fM.length===0))&&<div style={{textAlign:"center",color:"#aaa",padding:40}}>ยังไม่มีข้อมูล</div>}
        </div>
      </Card>
      {viewer&&<ImageViewer images={viewer.images} startIdx={viewer.idx} onClose={()=>setViewer(null)}/>}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
